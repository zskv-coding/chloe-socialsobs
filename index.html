<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>chloeeezyMC - Socials Overlay</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
  }

  #stage {
    position: fixed;
    left: 0;
    bottom: 70px;
    width: 100%;
    height: 160px;
    pointer-events: none;
  }

  .card {
    position: absolute;
    left: -560px;
    top: 20px;
    display: flex;
    align-items: stretch;
    width: 480px;
    height: 118px;
    background: linear-gradient(160deg, #FFF6F9 0%, #FFE3ED 100%);
    border: 3px solid #FF6B9D;
    border-radius: 26px;
    transition: left 0.6s cubic-bezier(0.16, 1, 0.3, 1), top 2.4s ease-in-out;
    box-shadow: 0 12px 26px rgba(219, 39, 119, 0.25);
    animation: float 2.4s ease-in-out infinite;
  }
  .card.in { left: 40px; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 26px;
    opacity: 0.5;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,107,157,0.10) 0 6px, transparent 7px),
      radial-gradient(circle at 60% 70%, rgba(255,107,157,0.10) 0 6px, transparent 7px),
      radial-gradient(circle at 85% 25%, rgba(255,107,157,0.08) 0 5px, transparent 6px);
    pointer-events: none;
  }

  .icon-chip {
    position: relative;
    flex: 0 0 100px;
    margin: 9px 0 9px 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #FFFDFC;
    border-radius: 50%;
    border: 2px solid var(--accent, #FFB3C6);
    overflow: hidden;
  }

  .icon-chip img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .icon-fallback {
    display: none;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--accent, #FFB3C6);
    color: #FFFDFC;
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 26px;
  }

  .info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    padding: 0 22px 0 18px;
    min-width: 0;
  }

  .platform {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 700;
    font-size: 21px;
    color: #7A2E4A;
  }

  .handle {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: var(--accent-dark, #D6336C);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .garland {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .garland .bloom {
    position: absolute;
    width: 20px;
    height: 20px;
  }
</style>
</head>
<body>

<div id="stage">
  <div class="card" id="card">
    <div class="garland" id="garland"></div>

    <div class="icon-chip" id="iconChip">
      <img id="logoImg" alt="" />
      <div class="icon-fallback" id="logoFallback"></div>
    </div>
    <div class="info">
      <div class="platform" id="platformName"></div>
      <div class="handle" id="handleText"></div>
    </div>
  </div>
</div>

<script>
  const socials = [
    {
      name: 'YouTube',
      initial: 'Y',
      handle: 'youtube.com/@chloeeezyMC',
      accent: '#FF9FB3',
      accentDark: '#E0475F',
      logo: 'logos/youtube_logo.png'
    },
    {
      name: 'Twitch',
      initial: 'T',
      handle: 'twitch.tv/chloeeezy',
      accent: '#DDA8F0',
      accentDark: '#9B4FC9',
      logo: 'logos/twitch_logo.png'
    },
    {
      name: 'Instagram',
      initial: 'I',
      handle: 'instagram.com/chloeeezymc',
      accent: '#F7A8C4',
      accentDark: '#D6336C',
      logo: 'logos/instagram_logo.png'
    },
    {
      name: 'EchoCraft Community Discord',
      initial: 'D',
      handle: 'discord.gg/QTFZzzTJxd',
      accent: '#B8A8F0',
      accentDark: '#6C5CE7',
      logo: 'logos/discord_logo.png'
    }
  ];

  const HOLD_MS = 15000;
  const GAP_MS = 700;

  const card = document.getElementById('card');
  const logoImg = document.getElementById('logoImg');
  const logoFallback = document.getElementById('logoFallback');
  const platformName = document.getElementById('platformName');
  const handleText = document.getElementById('handleText');
  const garland = document.getElementById('garland');

  const heartColors = ['#FFB3C6', '#FF8FAB', '#F9A8D4', '#FFD1DC', '#E8A8F0'];

  function heartSVG(color) {
    return `<svg viewBox="0 0 22 22" width="100%" height="100%">
      <path d="M11 19 C 2 13, 1 6, 6.5 3.5 C 9 2.3, 11 3.8, 11 6.2 C 11 3.8, 13 2.3, 15.5 3.5 C 21 6, 20 13, 11 19 Z" fill="${color}"/>
    </svg>`;
  }

  function buildGarland() {
    const cardWidth = 480;
    const cardHeight = 118;
    const topCount = 7;
    const bottomCount = 7;

    for (let i = 0; i < topCount; i++) {
      const bloom = document.createElement('div');
      bloom.className = 'bloom';
      bloom.style.left = `${20 + (i * (cardWidth - 90) / (topCount - 1))}px`;
      bloom.style.top = '-10px';
      bloom.innerHTML = heartSVG(heartColors[i % heartColors.length]);
      garland.appendChild(bloom);
    }

    for (let i = 0; i < bottomCount; i++) {
      const bloom = document.createElement('div');
      bloom.className = 'bloom';
      bloom.style.left = `${20 + (i * (cardWidth - 90) / (bottomCount - 1))}px`;
      bloom.style.bottom = '-10px';
      bloom.innerHTML = heartSVG(heartColors[(i + 2) % heartColors.length]);
      garland.appendChild(bloom);
    }

    [18, cardHeight - 30].forEach((topPos, idx) => {
      const bloom = document.createElement('div');
      bloom.className = 'bloom';
      bloom.style.left = '-10px';
      bloom.style.top = `${topPos}px`;
      bloom.innerHTML = heartSVG(heartColors[(idx + 4) % heartColors.length]);
      garland.appendChild(bloom);
    });

    [18, cardHeight - 30].forEach((topPos, idx) => {
      const bloom = document.createElement('div');
      bloom.className = 'bloom';
      bloom.style.right = '-10px';
      bloom.style.top = `${topPos}px`;
      bloom.innerHTML = heartSVG(heartColors[(idx + 1) % heartColors.length]);
      garland.appendChild(bloom);
    });
  }

  buildGarland();

  let i = 0;

  function showNext() {
    const item = socials[i % socials.length];
    i++;

    card.style.setProperty('--accent', item.accent);
    card.style.setProperty('--accent-dark', item.accentDark);

    logoImg.style.display = 'none';
    logoFallback.style.display = 'none';
    logoFallback.style.background = item.accent;
    logoFallback.textContent = item.initial;

    logoImg.onload = () => {
      logoImg.style.display = 'block';
      logoFallback.style.display = 'none';
    };
    logoImg.onerror = () => {
      logoImg.style.display = 'none';
      logoFallback.style.display = 'flex';
    };
    logoImg.src = item.logo;

    platformName.textContent = item.name;
    handleText.textContent = item.handle;

    requestAnimationFrame(() => {
      card.classList.add('in');
    });

    setTimeout(() => {
      card.classList.remove('in');
      setTimeout(showNext, 600 + GAP_MS);
    }, HOLD_MS);
  }

  showNext();
</script>

</body>
</html>
